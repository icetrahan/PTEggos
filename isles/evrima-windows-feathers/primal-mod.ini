; Primal pak config, read by start-evrima.ps1 and rendered into
; TheIsle\Saved\Config\WindowsServer\Engine.ini under the pak's section:
;
;   [/Game/TheIsle/Core/Session/BP_TIGameSession.BP_TIGameSession_C]
;
; WHY THIS FILE EXISTS
;   Engine.ini is copied from Engine.ini.tmpl on EVERY boot, so anything hand-edited
;   into Engine.ini through the file manager is destroyed on the next restart. Put it
;   here instead and the wrapper re-renders it every boot.
;   Egg VARIABLES (PRIMAL_FORCE_DINO / PRIMAL_MOD_INI) do the same job and WIN where
;   both are set - but they only reach the process once declared on the egg in
;   Pterodactyl, which an already-running server does not get without an egg update.
;   This file needs neither, which is why it is the fast path.
;
; RULES
;   - Plain Key=Value, one per line. ';' or '#' starts a comment.
;   - Values are csv STRINGS, never arrays - config arrays do not load (#572).
;   - The pak reads Engine.ini, NEVER launch flags: GetCommandLine() returns nothing
;     in a cooked server build, which is why -PrimalForceDino was inert (#501).
;   - The wrapper never rewrites this file. Edit it freely.

; --- DATA-PLANE WIRING: rendered automatically, do NOT put them here ---
;   ApiToken  <- the PHSK_KEY egg variable, per server
;   PollURL   <- https://data.primalhosted.com/v1/commands/text
; 🔴 ApiToken is a SECRET. It is written into Engine.ini at boot from the server's
; own key and is REDACTED in the console log. Never paste a phsk_ value into this
; file - it would be a per-tenant secret sitting in a shipped artifact.
; Override PollURL only for a test plane: PollURL=https://.../v1/commands/text

; Species the pak forces onto the roster ON TOP OF Game.ini's AllowedClasses.
; Dino Vibes runs Baryonyx + Oviraptor purely from this - their Game.ini has none -
; so leaving this empty is a roster change, not a no-op.
ForceDinoList=Baryonyx,Oviraptor

; Body sweep - ENABLED for Dino Vibes on Ice's instruction, 2026-08-01.
; ⚠️ The Lane B session recommended holding this OFF on a customer until #573 is
; settled (the census going silent means "a body actually left the array" is not
; yet proven). Ice overrode that deliberately; recorded here so the next reader
; knows it was a decision, not an oversight.
; 🔴 Key names are the PAK'S and are exact: True/False, not 1/0; a csv STRING,
; never an array (#572). Proven live at B70/B71.
BodySweepOn=True
BodySweepList=Triceratops
BodyHoldSec=10.0
